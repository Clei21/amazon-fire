<section class="sec atlas-section" id="atlas">
 <div class="wrap wrap-wide">
  <div class="atlas-titleline"><div><h2 class="t" data-i18n="atlasTitle">Onde queimou</h2><p class="d atl-finding" id="atlFinding" aria-live="polite"></p></div><div class="atlas-datasource" hidden><span>NASA / FIRMS</span><strong>MODIS · VIIRS</strong><small data-i18n="atlasDataNote">Focos ativos observados por satélite</small></div></div>
  <h3 class="atl-area"><span id="ovArea">—</span> <small id="ovCoverage">—</small></h3>
  <div class="chips atlas-regions" id="areaChips" role="group" data-i18n-aria="fArea"></div>
  <div class="coverage-info" id="coverageInfo" role="status" hidden></div>
  <div class="notice hidden" id="notice"></div>
  <div class="atl-grid">
  <div class="atl-modes">
    <div class="maplayer" role="group" data-i18n-aria="atlModesAria" aria-label="Visualização dos focos"><button id="layerDensity" aria-pressed="true" data-i18n="layerDensity">Concentração</button><button id="layerPoints" aria-pressed="false" data-i18n="layerPoints">Pontos</button><button id="layer3d" aria-pressed="false" data-i18n="layer3d">3D</button></div>
    <div class="mapstyle" role="group" data-i18n-aria="atlBaseAria" aria-label="Tipo de mapa"><button id="msMap" aria-pressed="true" data-i18n="msMap">Mapa</button><button id="msSat" aria-pressed="false" data-i18n="msSat">Satélite</button></div>
  </div>
   <aside class="atl-rank" id="atlRank" aria-live="polite"></aside>
   <div class="atlas-stage" id="atlasStage">
    <div class="map atlas-map" id="map">
      <canvas id="mapCanvas" role="img" data-i18n-aria="mapAria"></canvas><canvas id="map3d" hidden aria-hidden="true"></canvas><div class="m3-hint" id="m3Hint" hidden></div><div class="m3-card" id="m3Card" hidden></div>
      <div class="atl-tools" role="toolbar" id="atlTools" data-i18n-aria="atlToolsAria" aria-label="Ferramentas do mapa">
        <div class="atl-tg"><button class="atl-tb" id="btnDraw" type="button" aria-pressed="false"><svg class="ico"><use href="#i-draw"/></svg><span data-i18n="fDraw">Desenhar</span></button><button class="atl-tb" id="btnCoords" type="button"><svg class="ico"><use href="#i-target"/></svg><span data-i18n="fCoords">Coordenadas</span></button></div>
        <div class="ctrls"><button id="zIn" type="button" data-i18n-aria="zoomIn"><svg class="ico"><use href="#i-plus"/></svg></button><button id="zOut" type="button" data-i18n-aria="zoomOut"><svg class="ico"><use href="#i-minus"/></svg></button><button id="zFit" type="button" data-i18n-aria="zoomFit"><svg class="ico"><use href="#i-fit"/></svg></button><button id="btnFullMap" type="button" data-i18n-aria="atlasFull"><svg class="ico"><use href="#i-fit"/></svg></button></div>
      </div>
      <div class="note hidden" id="mapNote"></div><div class="attr" id="mapAttr"></div><div id="mapInspect" class="map-inspect hidden" role="status"></div>
    </div>
   </div>
   <div class="atl-below">
    <div class="atl-timeline">
      <div class="atl-tl-ctrl">
        <label class="atl-year"><span data-i18n="atlasTimelineYear">Ano</span><select id="atlasYear" aria-label="Ano"></select></label>
        <button class="atl-play" id="atlasPlay" type="button" aria-pressed="false" data-i18n-aria="playYearAria"><span class="atlas-play-glyph" aria-hidden="true">▶</span><span id="atlasPlayText" data-i18n="playYear">Animar meses</span></button>
        <details class="period-details atl-range" id="periodDetails">
          <summary data-i18n="atlasFilter">Intervalo personalizado</summary>
          <div class="period-filter" role="group" aria-label="Intervalo de datas">
            <div class="period-field"><label for="rangeStart" data-i18n="rangeStart">De</label><input type="date" id="rangeStart"></div>
            <div class="period-field"><label for="rangeEnd" data-i18n="rangeEnd">Até</label><input type="date" id="rangeEnd"></div>
            <button class="atl-tb atl-primary" id="rangeApply" type="button" data-i18n="applyRange">Aplicar período</button>
            <button class="atl-tb" id="rangeClear" type="button" data-i18n="clearRange">Limpar</button>
          </div>
          <p class="period-hint" id="periodHint" data-i18n="rangeHelp">O intervalo filtra as detecções do mapa e os arquivos exportados.</p>
        </details>
      </div>
      <div class="atl-chart">
        <div class="atl-chart-head"><h4 id="atlChartTitle"></h4><p id="atlChartSub"></p><div class="atl-chart-key" id="atlChartKey"></div></div>
        <div class="atlas-timeline" id="atlasTimeline" role="radiogroup"></div>
      </div>
    </div>
    <p class="atl-status" id="atlStatus" aria-live="polite"></p>
    <div class="atl-stats">
      <div class="atlas-stat"><span id="atlStatMonthLbl"></span><strong id="atlasCurrentDet">—</strong></div>
      <div class="atlas-stat"><span data-i18n="atlasReadingAll">Focos detectados desde 2000</span><strong id="ovHotspots">—</strong></div>
    </div>
    <details class="atl-tech"><summary data-i18n="atlTech">Detalhes técnicos</summary><p><span data-i18n="atlasReadingFactor">Fator MODIS → VIIRS</span>: <strong id="ovFactor">—</strong>. <span data-i18n="atlFactorD"></span></p></details>
    <div class="atl-legend" id="atlasLegend"></div>
    <p class="atl-cover" id="atlCover"></p>
    <details class="atlas-data-note"><summary data-i18n="atlasAccuracyTitle">Entenda as cores e as limitações do mapa</summary><p data-i18n="atlasAcc"></p></details>
   </div>
  </div>
  <div hidden aria-hidden="true"><div id="mpMonths"></div><b id="mapSub"></b><div class="atlas-timeline-pane"></div></div>
  <p id="atlasReading" class="sr-only" role="status" aria-live="polite"></p>
 </div>
</section>
